
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123e70" />
    <meta name="description" content="Mindrise helps you manage your alarms and sleep habits." />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/mindrise-bird.png" />
    <link rel="apple-touch-icon" href="/mindrise-bird.png" />

    <title>Mindrise</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((error) => {
            console.error("Mindrise service worker registration failed:", error);
          });
        });
      }
    </script>
  </body>
</html>
